<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>หน้าร้าน - คิวออเดอร์</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- เข้าสู่ระบบ -->
  <form id="loginView" class="login">
    <h2 style="margin:0">เข้าสู่ระบบหน้าร้าน</h2>
    <input class="input" id="email" type="email" placeholder="อีเมล" autocomplete="username" required>
    <input class="input" id="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn big">เข้าสู่ระบบ</button>
  </form>

  <!-- บอร์ดคิว -->
  <div id="appView" hidden>
    <div class="hdr">
      <h1 id="shop">หน้าร้าน</h1>
      <button class="btn" id="newBtn" style="background:#fff;color:var(--brand)">+ รับออเดอร์</button>
      <button class="btn" id="logout">ออก</button>
    </div>
    <div class="board">
      <div class="col"><h2>รอยืนยัน <span class="count" id="c-pending">0</span></h2><div id="col-pending"></div></div>
      <div class="col"><h2>กำลังทำ <span class="count" id="c-cooking">0</span></h2><div id="col-cooking"></div></div>
      <div class="col"><h2>พร้อมเสิร์ฟ / รับของ <span class="count" id="c-ready">0</span></h2><div id="col-ready"></div></div>
    </div>
  </div>

  <!-- หน้าจอรับออเดอร์โดยพนักงาน (นั่งในร้าน / กลับบ้าน) -->
  <div id="newView" class="overlay" hidden>
    <div class="hdr"><h1>รับออเดอร์ใหม่</h1><button class="btn" id="newClose">ปิด</button></div>
    <div class="split">
      <div class="left" id="staffMenu"></div>
      <div class="right">
        <div class="seg" id="typeSeg">
          <button data-type="dine_in" class="on">🪑 นั่งในร้าน</button>
          <button data-type="takeaway">🛍️ กลับบ้าน</button>
        </div>
        <div class="seg" id="tableSeg"></div>
        <div id="staffLines"></div>
        <input class="note" id="staffNote" placeholder="หมายเหตุ (ถ้ามี)" maxlength="300">
        <div class="row"><b class="grow">รวม</b><b id="staffSum">฿0</b></div>
        <p class="err" id="staffErr" hidden></p>
        <button class="btn big ok" id="staffSubmit">ส่งเข้าครัว</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="staff.js"></script>
</body>
</html>
